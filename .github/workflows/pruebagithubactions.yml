name: GitHub Actions Practica
on: [push]

jobs:
  Explorando-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "El flujo de trabajo ha sido ejecutado..."
      - run: echo "El trabajo se está ejecutando..."
      - run: echo "El nombre de la rama es..."
      - name: Verifica el código del repositorio
        uses: actions/checkout@v2
      - run: echo "El repositorio ha sido clonado"
      - name: Listar archivos
        run: ls ${{ github.workspace }}
      - run: echo "El estado del trabajo es: ${{ job.status }}"
